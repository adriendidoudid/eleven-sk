name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly drift check: the skill documents a third-party API that moves on its own.
    - cron: "17 6 * * 1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Static validation (frontmatter, bash syntax, JSON payloads, references)
        run: python3 scripts/validate.py
      - name: Test jq expressions against mock API responses
        run: bash scripts/test-jq.sh
      - name: Conformance against the Agent Skills reference implementation
        # The package is skills-ref, but the console script it installs is `agentskills`
        # (agentskills.io documents `skills-ref validate`, which does not exist).
        # Pinned because the reference library is still 0.x.
        run: |
          pip install --quiet skills-ref==0.1.1
          agentskills validate ./skills/elevenlabs

  # Compares every endpoint path and model id the skill documents against ElevenLabs'
  # live OpenAPI document. Needs no API key.
  api-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the skill against the live ElevenLabs API spec
        run: |
          rc=0
          python3 scripts/check-api-drift.py || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning::could not reach the ElevenLabs OpenAPI spec — drift check skipped"
            exit 0
          fi
          exit "$rc"

  # Optional live check against the real ElevenLabs API.
  # Runs only on manual dispatch and only if the ELEVENLABS_API_KEY repo secret is set
  # (Settings > Secrets and variables > Actions).
  live-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ping ElevenLabs models endpoint and diff the live catalogue
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "ELEVENLABS_API_KEY secret not set — skipping live smoke test."
            exit 0
          fi
          curl -sf https://api.elevenlabs.io/v1/models \
            -H "xi-api-key: $ELEVENLABS_API_KEY" \
            | jq -e '.[0].model_id'
          python3 scripts/check-api-drift.py
